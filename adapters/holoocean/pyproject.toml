[project]
name = "uw-holoocean-adapter"
version = "0.1.0"
description = "HoloOcean sensor gateway adapter — replaces the legacy ocean_t scripts (see README/NOTICE)."
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.21",
    "mcap>=1.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]
# opencv-python-headless/pyyaml are here (not the 'holoocean' extra) because
# calibrate_camera.py's calibration math (compute_intrinsics,
# compute_stereo_extrinsics) and its test coverage need cv2/yaml on any
# machine, independent of whether a real HoloOcean install is present.
# 'holoocean' is intentionally NOT listed here: it is only needed by
# holoocean_driver.py's HoloOceanSession, imported lazily and guarded (see
# that module's docstring). Making it a hard dependency would break
# installing/testing the rest of this package on a machine without
# HoloOcean, which is exactly this repo's current development machine.

[project.optional-dependencies]
holoocean = ["holoocean"]
dev = ["pytest>=7.0"]

[tool.uv]
# uv's default "universal" resolution solves the lock across every platform
# reachable by requires-python, including Windows — and holoocean==0.5.8's
# pywin32<=228 pin has no wheel for any cp310+ tag, so resolving the win32
# branch fails outright regardless of the platform actually running uv.
# This project only ever targets Linux (see CLAUDE.md/README — WSL2/Ubuntu
# dev machine, no Windows support claimed anywhere), so scope resolution to
# that and let the broken win32-only branch of holoocean's own metadata go
# unsolved rather than blocking every `uv sync`/`uv lock`.
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uw_holoocean_adapter*"]
