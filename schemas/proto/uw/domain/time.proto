syntax = "proto3";

package uw.domain;

// Clock domain declaration per platform architecture section 7.1: every
// timestamp must declare which clock it was read from, and capture_time /
// receive_time are always kept separate. Estimation uses capture_time only;
// receive_time is for scheduling/latency accounting.
enum ClockDomain {
  CLOCK_DOMAIN_UNSPECIFIED = 0;
  CLOCK_DOMAIN_SIMULATION = 1;   // HoloOcean / replay sim time
  CLOCK_DOMAIN_SYSTEM_MONOTONIC = 2;
  CLOCK_DOMAIN_SENSOR_HARDWARE = 3;
}

// Seconds since an epoch defined by the owning ClockDomain (not wall time
// unless CLOCK_DOMAIN_SYSTEM_MONOTONIC says so). int64 seconds + int32 nanos,
// mirroring google.protobuf.Timestamp's layout without taking the
// well-known-types dependency.
message Stamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
