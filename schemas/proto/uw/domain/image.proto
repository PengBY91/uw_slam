syntax = "proto3";

package uw.domain;

import "uw/domain/observation.proto";

// Canonical raw camera observation. Each physical camera emits its own
// ImageFrame; runtime pairing is reconstructed from capture time and rig
// configuration instead of being permanently baked into the bag.
message ImageFrame {
  ObservationHeader header = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 row_stride_bytes = 4;

  enum ImageEncoding {
    IMAGE_ENCODING_UNSPECIFIED = 0;
    IMAGE_ENCODING_MONO8 = 1;
    IMAGE_ENCODING_RGB8 = 2;
    IMAGE_ENCODING_BGR8 = 3;
  }
  ImageEncoding encoding = 5;

  bytes pixel_data = 6;
  // Producer's claim that this frame is undistorted and stereo-rectified
  // (shared row epipolar geometry against its pair). NOT currently enforced
  // by any consumer as of 2026-08-21 — stereo frontends (e.g.
  // stereo_optical_depth_frontend, stereo_landmark_vo_frontend) assume
  // rectified input and compute depth/disparity accordingly, but do not
  // check this flag, and only synthetic generators set it (always to
  // true). See docs/archive/uw-slam-production-readiness-and-roadmap-2026-08-21.md
  // P1 ("建立去畸变和双目极线校正，明确 raw/rectified 图像契约") for the
  // planned enforcement work.
  bool is_rectified = 7;
  double exposure_seconds = 8;
}
