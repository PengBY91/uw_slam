# 平台级默认值。不包含任何具体机体/场景信息（架构文档第 14.2 节）。
# 通过 --experiment 被 apps/synth_bag_gen 和 apps/replay_demo 消费；
# 具体消费到什么程度见 configs/README.md。

estimation:
  solver: gauss_newton_v1        # 第一版图优化库未定，见架构文档第 20 节延后决策
  max_iterations: 30
  initial_lambda: 1.0e-3
  # 丢弃开局前 N 秒的证据再开始融合（0 = 不启用）。取的是一个同类 ROS2 SVIn+
  # HoloOcean 部署（workfiles_02 的 merge_node）里"IMU 偏置还没收敛前丢弃早期帧"
  # 的经验；我们没有在线 IMU 滤波器，落地方式是：warmup 窗口内的 keyframe 整体
  # 不进图，第一个存活下来的 keyframe 变成新的 fixed anchor（实现见
  # apps/replay_demo.cpp）。
  warmup_seconds: 0.0

reliability:
  # 架构文档第 8.4 节：final_information = min(learned, physical, calibration, cross_modal)
  # v1 只实现了固定常数上限，真正的多路 cap 是后续工作。relative_pose 拆成
  # translation/rotation 两个独立上限（不再是单一 scalar）：
  # RelativePoseFactorBuilder 现在从 VO 前端的真实 6x6 covariance 白化残差，
  # 一个共用上限会让平移/旋转互相拖累对方的量级。
  default_sqrt_information:
    relative_pose:
      translation: 20.0
      rotation: 20.0
    sonar_range: 15.0
    depth: 20.0

frontends:
  sonar_cfar:
    training_cells: 16
    guard_cells: 4
    probability_false_alarm: 0.01
    detector_threshold: 50
    dbscan_eps_m: 0.20
    dbscan_min_samples: 2
    default_range_sigma_m: 0.05
    default_bearing_sigma_rad: 0.01
  target_association:
    max_corrected_time_delta_s: 0.05
    max_bearing_mahalanobis_sq: 9.0
    max_range_mahalanobis_sq: 9.0
    max_motion_bearing_delta_rad: 0.25
    max_motion_rate_rad_s: 1.5
    max_bearing_variance_rad2: 0.25
    max_range_variance_m2: 4.0
  target_tracker:
    association_mahalanobis_sq: 16.0
    confirm_hits: 2
    degraded_misses: 3
    stale_after_s: 0.5
    max_prediction_dt_s: 0.5
    bearing_acceleration_noise: 0.05
    range_acceleration_noise: 0.5
    merge_bearing_threshold_rad: 0.03
    merge_range_threshold_m: 0.30

online_assist:
  # 本地稠密立体深度补全默认关闭：视觉+声呐目标检测已经能独立驱动 tracking，
  # 稠密深度对 distance/path-offset 的实际收益要等配对场景/水池数据验证后再开，
  # 见 docs/superpowers/plans/2026-08-24-acoustic-optic-online-tracking.md Task 6。
  dense:
    enabled: false
    budget_ms: 100.0
  vehicle_state_stale_after_s: 0.5
  modality_stale_after_s: 1.0

runtime:
  lanes:
    localization: { priority: highest, queue_capacity: 64, overflow_policy: reject }
    correction:   { priority: high,    queue_capacity: 32, overflow_policy: drop_oldest }
    mapping:      { priority: medium,  queue_capacity: 16, overflow_policy: drop_oldest }
    evidence:     { priority: low,     queue_capacity: 256, overflow_policy: drop_oldest }
