# "怎么跑"：选择 frontend/estimator/reliability policy/map backend/算力预算
# （架构文档第 14.2 节）。可通过 --experiment 传给 apps/tools/synth_bag_gen 和
# apps/replay_demo；rig/scenario/defaults 三层已被完整加载，frontends/
# estimator_mode/map_backend 目前只读取和打印，还没有真正驱动算法选择，见
# configs/README.md。

rig: rig/example_auv.yaml
scenario: scenario/synthetic_smoke.yaml
defaults: defaults/platform.yaml

frontends:
  sonar: sonar_cfar_frontend_v1

factor_builders:
  - relative_pose_v1
  - sonar_range_v1
  - depth_v1

estimator_mode: black_box_vio     # 对应架构文档第 8.1 节；紧耦合模式需另开 experiment 文件
map_backend: submap_point_cloud_v1

output:
  trajectory_format: tum
  write_run_manifest: true
