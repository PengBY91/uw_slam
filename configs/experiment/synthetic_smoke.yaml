# "怎么跑"：选择 frontend/相对位姿输入模式/reliability policy/map backend/算力预算
# （架构文档第 14.2 节）。可通过 --experiment 传给 apps/synth_bag_gen.cpp 和
# apps/replay_demo；rig/scenario/defaults 三层已被完整加载。frontends/
# map_backend 目前仍只对应一条固定管线（还没有第二条实现可切换），但下面这些
# 值必须精确匹配那条实现的标识符——写错会在 replay_demo 启动时直接报错退出，
# 不会被静默忽略；estimator_mode 选择相对位姿输入来源，见 configs/README.md。

rig: rig/example_auv.yaml
scenario: scenario/synthetic_smoke.yaml
defaults: defaults/platform.yaml

frontends:
  optical: stereo_depth_frontend_v1
  sonar: sonar_cfar_frontend_v1

factor_builders:
  - relative_pose_v1
  - sonar_range_v1
  - depth_v1

# estimator_mode 是历史字段名，当前选择相对位姿输入来源，不切换求解器。
# black_box_vio 读取 bag 中外部/预生成量测；stereo_landmark_vo 从双目图像计算量测。
estimator_mode: black_box_vio     # 对应架构文档第 8.1 节；原生紧耦合尚未实现，不能通过此字段选择
# map_backend 是预留的地图实现选择，目前只有 submap_point_cloud_v1。
map_backend: submap_point_cloud_v1

output:
  trajectory_format: tum
  write_run_manifest: true

# P0 非放空 gate（见 docs/archive/uw-slam-production-readiness-and-roadmap-2026-08-21.md
# 5.5/7）：实测 ATE rmse≈0.0999m、12/12 matched poses（2026-08-26，
# apps/synth_bag_gen.cpp 给 pose/sonar/landmark 噪声拆分独立 RNG 流之后的新
# 基线——拆流前的 0.0666m 依赖的是三路噪声共享一个 mt19937_64、彼此消耗顺序
# 意外耦合产生的某一次具体实现，不是这个 seed 的稳定值，见 README「跨 seed
# 有波动」；阈值留了约2倍余量而不是卡实测值，避免正常波动导致 CI flaky）。
gates:
  require_converged: true
  max_ate_rmse_m: 0.2
  min_matched_ate_poses: 10
  require_nonempty_map: true
  # min_acoustic_optic_accepted/min_acoustic_optic_map_points stay disabled
  # (default 0) here on purpose: scenario/synthetic_smoke.yaml's three
  # targets never fall inside the camera's narrow FOV by real geometry (see
  # this scenario's own comment and configs/experiment/acoustic_optic_demo.yaml,
  # the one experiment whose scenario is built specifically to be visible to
  # both sensors). Enabling these here would require faking acceptance to
  # keep this experiment green, which we don't do — see CountDepthContributions.
