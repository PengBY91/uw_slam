# "怎么跑"：选择 frontend/estimator/reliability policy/map backend/算力预算
# （架构文档第 14.2 节）。可通过 --experiment 传给 apps/synth_bag_gen.cpp 和
# apps/replay_demo；rig/scenario/defaults 三层已被完整加载，frontends/
# estimator_mode/map_backend 目前只读取和打印，还没有真正驱动算法选择，见
# configs/README.md。

rig: rig/example_auv.yaml
scenario: scenario/synthetic_smoke.yaml
defaults: defaults/platform.yaml

frontends:
  optical: stereo_depth_frontend_v1
  sonar: sonar_cfar_frontend_v1

factor_builders:
  - relative_pose_v1
  - sonar_range_v1
  - depth_v1

estimator_mode: black_box_vio     # 对应架构文档第 8.1 节；紧耦合模式需另开 experiment 文件
map_backend: submap_point_cloud_v1

output:
  trajectory_format: tum
  write_run_manifest: true

# P0 非放空 gate（见 docs/uw-slam-production-readiness-and-roadmap-2026-08-21.md
# 5.5/7）：实测 ATE rmse≈0.0666m、12/12 matched poses（README「跨 seed 有波动」，
# 阈值留了约2倍余量而不是卡实测值，避免正常波动导致 CI flaky）。
gates:
  require_converged: true
  max_ate_rmse_m: 0.15
  min_matched_ate_poses: 10
  require_nonempty_map: true
