# 跟 synthetic_smoke.yaml 完全一样，只是相对位姿输入模式（estimator_mode）换成
# stereo_landmark_vo：
# apps/replay_demo 会用 include/frontends/stereo_landmark_vo_frontend.hpp 从
# /raw/camera/left,right 实时算相对位姿因子，取代 synthetic_smoke.yaml 默认的
# black_box_vio（从 synth_bag_gen 写进 bag 的 ground-truth+noise 证据里读）。
# 见 configs/README.md 里这个字段的说明。

rig: rig/example_auv.yaml
scenario: scenario/synthetic_smoke.yaml
defaults: defaults/platform.yaml

frontends:
  optical: stereo_depth_frontend_v1
  sonar: sonar_cfar_frontend_v1

factor_builders:
  - relative_pose_v1
  - sonar_range_v1
  - depth_v1

# estimator_mode 是历史字段名，当前选择相对位姿输入来源，不切换求解器。
# black_box_vio 读取 bag 中外部/预生成量测；stereo_landmark_vo 从双目图像计算量测。
estimator_mode: stereo_landmark_vo
# map_backend 是预留的地图实现选择，目前只有 submap_point_cloud_v1。
map_backend: submap_point_cloud_v1

output:
  trajectory_format: tum
  write_run_manifest: true

# P0 非放空 gate（见 docs/uw-slam-production-readiness-and-roadmap-2026-08-21.md
# 5.5/7）：实测 ATE rmse≈0.1013m、11/11 matched poses（2026-08-26，
# apps/synth_bag_gen.cpp 拆分 pose/sonar/landmark 独立 RNG 流之后的新基线，
# 同一次拆流修复也顺带修了 estimation/gauss_newton_solver.cpp 一个真实存在的
# bug：`cost_change_tolerance` 之前是绝对值 1e-12，跟这类问题量级的
# EvaluateAll/LDLT 浮点噪声下限基本重合，会让本已收敛的问题在最后一两次迭代
# 里被随机判成"stalled"——这个 experiment 修 RNG 前刚好卡在能报 converged
# 的那一侧，修完 RNG 后刚好翻到 stalled 那一侧，两个问题一起修才稳定；见该
# 文件 Solve() 里改成相对容差后的注释），阈值留了约2倍余量。
gates:
  require_converged: true
  max_ate_rmse_m: 0.2
  min_matched_ate_poses: 9
  require_nonempty_map: true
