# Tether-limited profile (PREP-E-02): nominal sensor rates (20/10/50 Hz)
# behind a shaped link modelling the contract tether (docs/ROV平台参数.md
# ROV-05: 10–40 Mbps measured). `fault_profile: bandwidth` makes
# realtime_gate.py launch realtime_ros_session with --fault-profile bandwidth
# and the --bandwidth-* flags below (adapters/holoocean/uw_holoocean_adapter/
# fault_injector.py BandwidthShaper): the available rate random-walks
# between min/max starting at nominal, over-budget traffic is queued by
# priority (vehicle state > sonar > pilot video > left/right/main camera)
# and dropped lowest-priority-first once the backlog exceeds max_queue_s.
# Consumed by `python -m uw_holoocean_adapter.realtime_gate --profile <this
# file>` -- see rov_realtime_minimum.yaml's header comment for the
# directory-collision note (this is NOT a C++-side experiment config).
profile: tether_limited
duration_s: null  # defaults to the task manifest's max_duration_s
camera:
  hz: 20.0
  width: 1280
  height: 720
  payload_scale: 1.0
sonar_hz: 10.0
state_hz: 50.0
faults_enabled: true
disturbance_matrix_enabled: false
fault_profile: bandwidth
fault_seed: 42  # fixed so the bandwidth walk -- and hence the latency metrics -- reproduce across runs
bandwidth:
  nominal_mbps: 20.0
  min_mbps: 10.0
  max_mbps: 40.0
  walk_sigma_mbps_per_s: 2.0
soak: false
min_output_hz: 10.0
gate: tether_limited  # run_report.tether_limited_gate(): result age p95 <= 400 ms, state age <= 150 ms, misses <= 2%
